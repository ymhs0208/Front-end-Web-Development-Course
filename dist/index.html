<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F5EEFF" />
    <meta
      name="description"
      content="金庫防爆特攻隊：用生活情境練習辨識詐騙，大字體、語音朗讀，陪你一步步守護安心生活。"
    />
    <title>金庫防爆特攻隊｜安心學防詐</title>
    <link rel="stylesheet" href="style.css?v=calm-1" />
  </head>
  <body>
    <a class="skip" href="#main">跳到主要內容</a>
    <header class="site-header">
      <a class="header-brand" href="#home" aria-label="金庫防爆特攻隊，返回首頁"
        ><svg
          class="header-home-icon"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          /></svg
        ><strong>金庫防爆特攻隊</strong></a
      >
      <div class="header-settings" role="group" aria-label="閱讀與語音設定">
        <label class="header-control"
          ><span>字體</span
          ><select id="fontSizeSelect" aria-label="字體大小">
            <option value="0">大字</option>
            <option value="1">更大</option>
            <option value="2">特大</option>
            <option value="3">最大</option>
          </select></label
        >
        <label class="header-control"
          ><span>語音</span
          ><select id="voiceSelect" aria-label="語音語言">
            <option value="off">關閉</option>
            <option value="mandarin">國語</option>
            <option value="taigi">台語</option>
            <option value="hakka">客語</option>
          </select></label
        >
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer>
      <a class="brand footer-brand" href="#home"
        ><span class="brand-icon">▥</span><span>金庫防爆特攻隊</span></a
      >
      <a href="#guide">使用說明 ↗</a>
    </footer>
    <div class="ios-backbar" id="backBar" hidden>
      <button data-home><span aria-hidden="true">‹</span> 返回主畫面</button>
    </div>
    <div id="toast" role="status"></div>
    <script type="module" src="js/main.js?v=start-card-1"></script>
  </body>
</html>
